name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-2

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ""

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pomegranate/requirements.ci.txt

      - name: Verify ML inference package
        run: |
          set -euo pipefail
          test -f ml/pomegranate/infer.py
          test -f ml/pomegranate/serve.py
          test -f ml/pomegranate/Dockerfile
          test -f ml/pomegranate/models/DenseNet_Model.keras
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          for path in Path("ml/pomegranate/models").iterdir():
              if path.is_file() and path.stat().st_size >= limit:
                  raise SystemExit(f"{path} is >= 100MB")
          print("Model artifact sizes OK")
          PY

      - name: Install ML Python dependencies (CI)
        working-directory: ml/pomegranate
        run: pip install -r requirements.ci.txt

      - name: Compile ML Python sources
        working-directory: ml/pomegranate
        run: python -m py_compile infer.py serve.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        env:
          DOCKER_BUILDKIT: "1"
          DB_PASSWORD: daruru_root
          MYSQL_APP_USER: daruru
          DB_DATABASE: daruru_farm
          JWT_SECRET: ci_only_jwt_secret_not_for_production
        run: docker compose build backend frontend ml

  deploy:
    name: Deploy to AWS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        id: images
        run: |
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          REG=${{ env.AWS_REGION }}
          echo "frontend=$ACCOUNT.dkr.ecr.$REG.amazonaws.com/darurufarm-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$ACCOUNT.dkr.ecr.$REG.amazonaws.com/darurufarm-backend" >> "$GITHUB_OUTPUT"
          echo "ml=$ACCOUNT.dkr.ecr.$REG.amazonaws.com/darurufarm-ml" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=
            VITE_GOOGLE_CLIENT_ID=

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}

      - name: Build and push ML
        uses: docker/build-push-action@v6
        with:
          context: ./ml/pomegranate
          file: ./ml/pomegranate/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.ml }}:latest
            ${{ steps.images.outputs.ml }}:${{ github.sha }}

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID}" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=darurufarm-prod-ec2" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text)
          fi
          echo "Deploying to $INSTANCE_ID"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "DaruruFarm deploy ${{ github.sha }}" \
            --parameters 'commands=["/usr/local/bin/darurufarm-deploy"]' \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json
