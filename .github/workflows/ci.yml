name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ""

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pomegranate/requirements.ci.txt

      - name: Verify ML inference package
        run: |
          set -euo pipefail
          test -f ml/pomegranate/infer.py
          test -f ml/pomegranate/serve.py
          test -f ml/pomegranate/Dockerfile
          test -f ml/pomegranate/requirements.docker.txt
          test -f ml/pomegranate/models/DenseNet_Model.keras
          test -f ml/pomegranate/models/feature_extractor.keras
          test -f ml/pomegranate/models/healthy_mean.npy
          test -f ml/pomegranate/models/healthy_std.npy
          test -f ml/pomegranate/models/scaler_dict.pkl
          test -f ml/pomegranate/models/gmm_dict.pkl
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          for path in Path("ml/pomegranate/models").iterdir():
              if path.is_file() and path.stat().st_size >= limit:
                  raise SystemExit(f"{path} is >= 100MB and will fail on GitHub")
          print("Model artifact sizes OK")
          PY

      - name: Install ML Python dependencies (CI, no TensorFlow host wheel)
        working-directory: ml/pomegranate
        run: pip install -r requirements.ci.txt

      - name: Compile ML Python sources
        working-directory: ml/pomegranate
        run: python -m py_compile infer.py serve.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all application Docker images
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          # CI-only placeholders (no secrets). Avoid depending on a local .env file.
          DB_PASSWORD: daruru_root
          MYSQL_APP_USER: daruru
          DB_DATABASE: daruru_farm
          JWT_SECRET: ci_only_jwt_secret_not_for_production
          TYPEORM_SYNCHRONIZE: "true"
          RAZORPAY_KEY_ID: ""
          RAZORPAY_KEY_SECRET: ""
          GOOGLE_CLIENT_ID: ""
          VITE_GOOGLE_CLIENT_ID: ""
        run: docker compose build backend frontend ml
