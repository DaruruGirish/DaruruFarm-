# version: "3.9"  # deprecated, ignored by Compose V2

services:

  daruru-db:
    image: mysql:8
    container_name: daruru-db
    restart: unless-stopped
    env_file: ./.env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - darurufarms-network

  darurufarms-backend:
    build: ./backend
    image: darurufarms-backend:dev
    container_name: darurufarms-backend
    restart: unless-stopped
    env_file: ./.env

    depends_on:
      - daruru-db

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}

    ports:
      - "3001:3000"

    networks:
      - darurufarms-network

  darurufarms-frontend:
    build: ./frontend
    image: darurufarms-frontend:dev
    container_name: darurufarms-frontend
    restart: unless-stopped
    depends_on:
      - darurufarms-backend
    env_file: ./.env

    ports:
      - "80:80"

    networks:
      - darurufarms-network

networks:
  darurufarms-network:

volumes:
  mysql_data:
